    <circle cx="30" cy="30" r="8" fill="#FDB913"/>
    <path d="M30 15v4m0 22v4M15 30h4m22 0h4m-19-11l3 3m14 14l3 3m-20 0l3-3m14-14l3-3" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
