    <rect width="48" height="48" x="6" y="6" rx="10" fill="#0091DA"/>
    <circle cx="30" cy="27" r="13" fill="#FFFFFF"/>
    <circle cx="30" cy="27" r="5" fill="#0091DA"/>
    <rect width="3.5" height="11" x="28.2" y="27" fill="#0091DA"/>
    <!-- Typography -->
    <text x="64" y="27" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#003366" letter-spacing="-0.2">SBI LIFE</text>
    <text x="64" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#0091DA" letter-spacing="1">INSURANCE</text>
  </g>
